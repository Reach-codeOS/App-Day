name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Сборка Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Загрузка APK файла
        uses: actions/upload-artifact@v4
        with:
          name: Planner-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
